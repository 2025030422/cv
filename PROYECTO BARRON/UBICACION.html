<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Angelotes - Ubicación</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#000;
    color:#fff;
    overflow: hidden;
}

/* ====== BARRA SUPERIOR ====== */
header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:#2f2f2f;
    display:flex;
    align-items:center;
    padding:0 20px;
    z-index:1000;
}

/* ====== LOGO ====== */
.logo{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    height:100%;
    margin-left:-15px;
}

.logo a{
    display:flex;
    align-items:center;
    text-decoration:none;
}

.logo img{
    height:240px;
    width:auto;
    object-fit:contain;
    display:block;
    transform:translateY(22px);
    cursor:pointer;
}

/* ====== MENÚ ====== */
nav{
    margin-left:auto;
    margin-right:40px;
}

nav ul{
    display:flex;
    list-style:none;
    gap:60px;
}

nav ul li a{
    position:relative;
    color:#fff;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    padding-bottom:6px;
    transition:.3s;
}

nav ul li a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:0;
    height:3px;
    background:#c89b2b;
    transition:.3s;
}

nav ul li a:hover::after,
nav ul li a.active::after{
    width:100%;
}

nav ul li a:hover,
nav ul li a.active{
    color:#c89b2b;
    text-shadow:0 0 10px #f4d35e;
}

/* ====== ICONOS DERECHOS ====== */
.iconos-derecha{
    display:flex;
    align-items:center;
    gap:15px;
}

.iconos-derecha a{
    display:flex;
    align-items:center;
    text-decoration:none;
}

.iconos-derecha img{
    width:55px;
    height:55px;
    object-fit:contain;
    cursor:pointer;
    transition:.3s;
}

.iconos-derecha img:hover{
    transform:scale(1.1);
}

/* ====== CONTENEDOR Y EFECTOS DEL CARRITO (IDENTICO AL MENU) ====== */
.contenedor-carrito {
    position: relative;
    display: flex;
    align-items: center;
}

@keyframes pulsoDorado {
    0% { filter: drop-shadow(0 0 2px #c89b2b); }
    50% { filter: drop-shadow(0 0 15px #f4d35e); }
    100% { filter: drop-shadow(0 0 2px #c89b2b); }
}

.contenedor-carrito.con-pendientes img {
    animation: pulsoDorado 2s infinite ease-in-out;
}

.contador-carrito {
    position: absolute;
    top: 2px;
    right: 2px;
    background: #c89b2b;
    color: #fff;
    font-size: 11px;
    font-weight: bold;
    min-width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    border: 2px solid #2f2f2f;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
}

.contenedor-carrito.con-pendientes .contador-carrito {
    opacity: 1;
}

.micro-ventana-carrito {
    position: absolute;
    top: 55px;
    right: 0;
    width: 320px;
    background: #1f1f1f;
    border: 1px solid #c89b2b;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity 0.3s, transform 0.3s, visibility 0.3s;
    z-index: 2000;
}

.contenedor-carrito:hover .micro-ventana-carrito {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.micro-ventana-carrito h3 {
    font-size: 16px;
    color: #c89b2b;
    border-bottom: 1px solid #333;
    padding-bottom: 8px;
    text-align: center;
}

.lista-mini-productos {
    max-height: 200px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.lista-mini-productos::-webkit-scrollbar { width: 4px; }
.lista-mini-productos::-webkit-scrollbar-thumb { background: #c89b2b; border-radius: 4px; }

.mini-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #2a2a2a;
    padding: 8px;
    border-radius: 6px;
}

.mini-item-info {
    flex: 1;
}

.mini-item-nombre {
    font-size: 13px;
    font-weight: bold;
}

.mini-item-precio {
    font-size: 12px;
    color: #c89b2b;
}

.mini-item-controles {
    display: flex;
    align-items: center;
    gap: 6px;
}

.mini-btn {
    background: #3a3a3a;
    border: none;
    color: white;
    width: 20px;
    height: 20px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
}

.mini-btn:hover { background: #c89b2b; }

.mini-btn-eliminar {
    background: #8b2525;
    font-size: 10px;
}
.mini-btn-eliminar:hover { background: #b83232; }

.mini-item-cant {
    font-size: 13px;
    font-weight: bold;
    min-width: 14px;
    text-align: center;
}

.mini-total {
    border-top: 1px solid #333;
    padding-top: 8px;
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 15px;
}

.btn-pagar-mini {
    background: #c89b2b;
    color: black;
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s, transform 0.1s;
    font-size: 14px;
}

.btn-pagar-mini:hover {
    background: #f4d35e;
    transform: scale(1.02);
}

.carrito-vacio-texto {
    text-align: center;
    color: #888;
    font-size: 13px;
    padding: 15px 0;
}

/* ====== SECCIÓN DE UBICACIÓN ====== */
.hero-ubicacion {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding-top: 120px;
    padding-bottom: 40px;
    overflow: hidden;
}

.hero-ubicacion::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url("fondo.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    filter: blur(8px); 
    transform: scale(1.1); 
    z-index: 1;
}

.seccion-titulo, .bloque-direcciones, .eslogan-final {
    position: relative;
    z-index: 2;
}

.seccion-titulo {
    text-align: center;
    width: 100%;
    max-width: 600px;
}

.seccion-titulo h1 {
    font-size: 42px;
    letter-spacing: 3px;
    color: #fff;
    font-weight: 300;
    margin-bottom: 10px;
    text-transform: uppercase;
}

.linea-divisoria {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, transparent, #c89b2b, transparent);
    margin-bottom: 40px;
}

.bloque-direcciones {
    display: flex;
    justify-content: center;
    align-items: flex-end; 
    gap: 80px;
    width: 100%;
    max-width: 1200px;
    padding: 0 40px;
}

.columna-ubicacion {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    flex: 1;
}

.enlace-mapa {
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.2s ease, opacity 0.2s ease;
}

.columna-ubicacion.centro {
    transform: translateY(-50px);
}

.columna-ubicacion.centro .enlace-mapa:hover {
    transform: scale(1.05);
}

.columna-ubicacion img {
    width: 110px;
    height: 110px;
    object-fit: contain;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
}

.columna-ubicacion p {
    font-size: 19px;
    color: #fff;
    letter-spacing: 0.5px;
    line-height: 1.4;
}

.eslogan-final {
    color: #c89b2b;
    font-size: 22px;
    letter-spacing: 2px;
    text-align: center;
    font-weight: 300;
    text-transform: uppercase;
    text-shadow: 0 0 5px rgba(200, 155, 43, 0.3);
}

@media (max-width: 900px) {
    .bloque-direcciones {
        flex-direction: column;
        align-items: center;
        gap: 60px;
    }
    .columna-ubicacion.centro {
        transform: translateY(0);
    }
    .hero-ubicacion {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
        padding-top: 110px;
        padding-bottom: 40px;
    }
    body {
        overflow: auto;
    }
}
</style>
</head>
<body>

<header>
    <div class="logo">
        <a href="PAGINA PRINCIPAL.html">
            <img src="logo.png" alt="Logo">
        </a>
    </div>

    <nav>
        <ul>
            <li><a href="MENU.html">MENÚ</a></li>
            <li><a href="CONTACTO.html">CONTACTO</a></li>
            <li><a href="UBICACION.html" class="active">UBICACIÓN</a></li>
        </ul>
    </nav>

    <div class="iconos-derecha">
        <a href="LOGIN.html">
            <img src="login.png" alt="Login">
        </a>
        
        <div class="contenedor-carrito" id="wrapper-carrito">
            <a href="CARRITO.html">
                <img src="carrito.png" alt="Carrito">
            </a>
            <div class="contador-carrito" id="micro-contador">0</div>
            
            <div class="micro-ventana-carrito">
                <h3>Tu Pedido</h3>
                <div class="lista-mini-productos" id="mini-lista-items"></div>
                <div class="mini-total">
                    <span>Total:</span>
                    <span id="mini-precio-total">$0</span>
                </div>
                <button class="btn-pagar-mini" onclick="pagarPedido()">Proceder al Pago</button>
            </div>
        </div>
    </div>
</header>

<section class="hero-ubicacion">
    <div class="seccion-titulo">
        <h1>Ubicación</h1>
        <div class="linea-divisoria"></div>
    </div>
    <div class="bloque-direcciones">
        <div class="columna-ubicacion">
            <img src="pin.png" alt="Ubicación">
            <p>Próximamente<br>Nueva Sucursal</p>
        </div>
        <div class="columna-ubicacion centro">
            <a href="https://maps.app.goo.gl/13CnG33Gk5ZgGdSy5?g_st=ic" target="_blank" class="enlace-mapa">
                <img src="pin.png" alt="Ubicación Principal">
                <p>Primera Sucursal</p>
            </a>
        </div>
        <div class="columna-ubicacion">
            <img src="pin.png" alt="Ubicación">
            <p>Próximamente<br>Nueva Sucursal</p>
        </div>
    </div>
    <div class="eslogan-final">Sabor que conquista desde el primer bocado</div>
</section>

<script>
// FUNCIONES COMPARTIDAS DEL CARRITO FLOTANTE DEL MENÚ
function actualizarInterfazCarrito() {
    const carrito = JSON.parse(localStorage.getItem('carritoAngelotes')) || [];
    const wrapperCarrito = document.getElementById("wrapper-carrito");
    const microContador = document.getElementById("micro-contador");
    const miniListaItems = document.getElementById("mini-lista-items");
    const miniPrecioTotal = document.getElementById("mini-precio-total");

    let totalProductos = 0;
    let costoTotal = 0;

    miniListaItems.innerHTML = "";

    if (carrito.length === 0) {
        wrapperCarrito.classList.remove("con-pendientes");
        miniListaItems.innerHTML = `<div class="carrito-vacio-texto">Tu carrito está vacío</div>`;
        microContador.textContent = "0";
        miniPrecioTotal.textContent = "$0";
        return;
    }

    wrapperCarrito.classList.add("con-pendientes");

    carrito.forEach((producto, index) => {
        totalProductos += producto.cantidad;
        costoTotal += producto.precio * producto.cantidad;

        miniListaItems.innerHTML += `
            <div class="mini-item">
                <div class="mini-item-info">
                    <div class="mini-item-nombre">${producto.nombre}</div>
                    <div class="mini-item-precio">$${producto.precio * producto.cantidad}</div>
                </div>
                <div class="mini-item-controles">
                    <button class="mini-btn" onclick="cambiarCantidadMini(${index}, -1)">-</button>
                    <span class="mini-item-cant">${producto.cantidad}</span>
                    <button class="mini-btn" onclick="cambiarCantidadMini(${index}, 1)">+</button>
                    <button class="mini-btn mini-btn-eliminar" onclick="eliminarDelMini(${index})">🗑️</button>
                </div>
            </div>
        `;
    });

    microContador.textContent = totalProductos;
    miniPrecioTotal.textContent = `$${costoTotal}`;
}

function cambiarCantidadMini(index, cambio) {
    let carrito = JSON.parse(localStorage.getItem('carritoAngelotes')) || [];
    carrito[index].cantidad += cambio;

    if (carrito[index].cantidad <= 0) {
        carrito.splice(index, 1);
    }

    localStorage.setItem('carritoAngelotes', JSON.stringify(carrito));
    actualizarInterfazCarrito();
}

function eliminarDelMini(index) {
    let carrito = JSON.parse(localStorage.getItem('carritoAngelotes')) || [];
    carrito.splice(index, 1);
    localStorage.setItem('carritoAngelotes', JSON.stringify(carrito));
    actualizarInterfazCarrito();
}

function pagarPedido() {
    let carrito = JSON.parse(localStorage.getItem('carritoAngelotes')) || [];
    if(carrito.length === 0) {
        alert("El carrito está vacío.");
        return;
    }
    window.location.href = "CARRITO.html"; 
}

document.addEventListener("DOMContentLoaded", () => {
    actualizarInterfazCarrito();
});
</script>

</body>
</html>
